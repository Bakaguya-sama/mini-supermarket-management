      summary: reassign Delivery
      operationId: reassignDelivery
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/feedbacks/:
    post:
      tags:
        - feedback
      summary: create Feedback
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - subject
                - customer_id
              properties:
                category:
                  type: string
                  enum:
                    - complaint
                    - suggestion
                    - praise
                subject:
                  type: string
                  example: Product quality issue
                detail:
                  type: string
                  example: The product arrived damaged and the packaging was open.
                customer_id:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                sentiment:
                  type: string
                  example: negative
                order_id:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
    get:
      tags:
        - feedback
      summary: get All Feedbacks
      operationId: getAllFeedbacks
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/feedbacks/customer/{customerId}':
    get:
      tags:
