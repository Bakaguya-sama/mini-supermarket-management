openapi: 3.0.0
info:
  title: Mini Supermarket API
  version: 1.0.0
  description: API cho hệ thống quản lý siêu thị mini
servers:
  - url: 'http://localhost:5000'
components:
  schemas:
    IdParam:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
paths:
  /api/auth/register/customer:
    post:
      tags:
        - auth
      summary: register Customer
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/auth/register/staff:
    post:
      tags:
        - auth
      summary: register Staff
      operationId: registerStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/auth/login:
    post:
      tags:
        - auth
      summary: login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/auth/me:
    get:
      tags:
        - auth
      summary: get Me
      operationId: getMe
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/auth/update-profile:
    put:
      tags:
        - auth
      summary: update Profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/auth/change-password:
    put:
      tags:
        - auth
      summary: change Password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/auth/verify-token:
    post:
      tags:
        - auth
      summary: verify Token
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/customer/{customerId}':
    get:
      tags:
        - cart
      summary: get Cart By Customer
      operationId: getCartByCustomer
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/carts/:
    get:
      tags:
        - cart
      summary: get All Carts
      operationId: getAllCarts
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/{id}':
    get:
      tags:
        - cart
      summary: get Cart By Id
      operationId: getCartById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/{cartId}/items':
    post:
      tags:
        - cart
      summary: add Item To Cart
      operationId: addItemToCart
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/items/{itemId}/quantity':
    put:
      tags:
        - cart
      summary: update Item Quantity
      operationId: updateItemQuantity
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/items/{itemId}':
    delete:
      tags:
        - cart
      summary: remove Item From Cart
      operationId: removeItemFromCart
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/{cartId}/apply-promo':
    post:
      tags:
        - cart
      summary: apply Promo
      operationId: applyPromo
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/{cartId}/remove-promo':
    delete:
      tags:
        - cart
      summary: remove Promo
      operationId: removePromo
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/{cartId}/clear':
    delete:
      tags:
        - cart
      summary: clear Cart
      operationId: clearCart
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/carts/stats:
    get:
      tags:
        - cart
      summary: get Cart Stats
      operationId: getCartStats
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/carts/{cartId}/checkout':
    patch:
      tags:
        - cart
      summary: checkout Cart
      operationId: checkoutCart
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/customers:
    get:
      tags:
        - customer
      summary: Get all customers with pagination and filtering
      operationId: getAllCustomers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Records per page
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
              - pending
          description: Customer status filter
      responses:
        '200':
          description: Successfully retrieved customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
                  data:
                    type: array
        '400':
          description: Invalid query parameters
    post:
      tags:
        - customer
      summary: Create a new customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Nguyen Van A
                email:
                  type: string
                  format: email
                  example: customer@example.com
                phone:
                  type: string
                  pattern: '^[0-9]{10}$'
                  example: 0912345678
                address:
                  type: string
                  minLength: 5
                  maxLength: 500
                  example: 123 Main St
                membershipType:
                  type: string
                  enum:
                    - Standard
                    - Gold
                    - Silver
                  example: Standard
                age:
                  type: integer
                  minimum: 18
                  maximum: 120
                  example: 30
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - pending
                  default: active
              required:
                - name
                - email
                - phone
      responses:
        '201':
          description: Customer created successfully
        '400':
          description: Invalid customer data
        '422':
          description: Validation error
  '/api/customers/{id}':
    get:
      tags:
        - customer
      summary: Get customer by ID
      operationId: getCustomerById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
          description: MongoDB customer ID
      responses:
        '200':
          description: Customer found
        '400':
          description: Invalid customer ID format
        '404':
          description: Customer not found
    put:
      tags:
        - customer
      summary: Update customer details
      operationId: updateCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^[0-9]{10}$'
                address:
                  type: string
                  minLength: 5
                  maxLength: 500
                membershipType:
                  type: string
                  enum:
                    - Standard
                    - Gold
                    - Silver
                age:
                  type: integer
                  minimum: 18
                  maximum: 120
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - pending
      responses:
        '200':
          description: Customer updated successfully
        '400':
          description: Invalid customer data
        '404':
          description: Customer not found
        '422':
          description: Validation error
    delete:
      tags:
        - customer
      summary: Delete customer
      operationId: deleteCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
                  example: Customer requested deletion
      responses:
        '200':
          description: Customer deleted successfully
        '400':
          description: Invalid customer ID
        '404':
          description: Customer not found
  '/api/customers/account/{accountId}':
    get:
      tags:
        - customer
      summary: Get customer by account ID
      operationId: getCustomerByAccount
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
          description: MongoDB account ID
      responses:
