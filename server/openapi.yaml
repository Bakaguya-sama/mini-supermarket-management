      summary: bulk Update Status
      operationId: bulkUpdateStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/delivery-orders/:
    get:
      tags:
        - deliveryOrder
      summary: get All Delivery Orders
      operationId: getAllDeliveryOrders
      responses:
        '200':
