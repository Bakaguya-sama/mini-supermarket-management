          description: Customer found by account
        '400':
          description: Invalid account ID format
        '404':
          description: Customer not found
  /api/customers/stats:
    get:
      tags:
        - customer
      summary: Get customer statistics
      operationId: getCustomerStats
      responses:
        '200':
          description: Customer statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalCustomers:
                        type: integer
                        minimum: 0
                      activeCustomers:
                        type: integer
                        minimum: 0
                      totalSpent:
                        type: number
                        minimum: 0
        '400':
          description: Error retrieving statistics
  '/api/customers/{id}/points':
    patch:
      tags:
        - customer
      summary: Update customer points
      operationId: updatePoints
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pointsToAdd:
                  type: integer
                  minimum: -10000
                  maximum: 10000
                  example: 100
              required:
                - pointsToAdd
      responses:
        '200':
          description: Points updated successfully
        '400':
          description: Invalid points value
        '404':
          description: Customer not found
        '422':
          description: Validation error
  '/api/customers/{id}/spent':
    patch:
      tags:
        - customer
      summary: Update total spent amount
      operationId: updateTotalSpent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0
                  maximum: 999999999
                  example: 150.5
              required:
                - amount
      responses:
        '200':
          description: Total spent updated successfully
        '400':
          description: Invalid amount
        '404':
          description: Customer not found
        '422':
          description: Validation error
  '/api/customers/{id}/orders':
    get:
      tags:
        - customer
      summary: Get customer orders
      operationId: getCustomerOrders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum:
              - pending
              - completed
              - cancelled
      responses:
        '200':
          description: Customer orders retrieved
        '400':
          description: Invalid query parameters
        '404':
          description: Customer not found
  /api/damaged-products/stats:
    get:
      tags:
        - damagedProduct
      summary: get Damaged Product Stats
      operationId: getDamagedProductStats
      responses:
        '200':
