openapi: 3.0.0
info:
  title: Mini Supermarket API
  version: 1.0.0
  description: API cho hệ thống quản lý siêu thị mini
servers:
  - url: http://localhost:5000
components:
  schemas:
    IdParam:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
paths:
  /api/suppliers/:
    get:
      tags:
        - supplier
      summary: get All Suppliers
      operationId: getAllSuppliers
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
    post:
      tags:
        - supplier
      summary: create Supplier
      operationId: createSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/suppliers/stats:
    get:
      tags:
        - supplier
      summary: get Supplier Stats
      operationId: getSupplierStats
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/suppliers/active:
    get:
      tags:
        - supplier
      summary: get Active Suppliers
      operationId: getActiveSuppliers
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/suppliers/{id}:
    get:
      tags:
        - supplier
      summary: get Supplier By Id
      operationId: getSupplierById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
    put:
      tags:
        - supplier
      summary: update Supplier
      operationId: updateSupplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
    delete:
      tags:
        - supplier
      summary: delete Supplier
      operationId: deleteSupplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/suppliers/{id}/products:
    get:
      tags:
        - supplier
      summary: get Supplier Products
      operationId: getSupplierProducts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/suppliers/{id}/permanent:
    delete:
      tags:
        - supplier
      summary: permanent Delete Supplier
      operationId: permanentDeleteSupplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/suppliers/{id}/activate:
    patch:
      tags:
        - supplier
      summary: activate Supplier
      operationId: activateSupplier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
tags: []
