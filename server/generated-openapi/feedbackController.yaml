openapi: 3.0.0
info:
  title: Mini Supermarket API
  version: 1.0.0
  description: API cho hệ thống quản lý siêu thị mini
servers:
  - url: http://localhost:5000
components:
  schemas:
    IdParam:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
paths:
  /api/feedbacks/:
    post:
      tags:
        - feedback
      summary: create Feedback
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - subject
                - customer_id
              properties:
                category:
                  type: string
                  enum:
                    - complaint
                    - suggestion
                    - praise
                subject:
                  type: string
                  example: Product quality issue
                detail:
                  type: string
                  example: The product arrived damaged and the packaging was open.
                customer_id:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                sentiment:
                  type: string
                  example: negative
                order_id:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
      responses:
        '201':
          description: Tạo thành công
        '400':
          description: Dữ liệu không hợp lệ
    get:
      tags:
        - feedback
      summary: get All Feedbacks
      operationId: getAllFeedbacks
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/feedbacks/customer/{customerId}:
    get:
      tags:
        - feedback
      summary: get Customer Feedbacks
      operationId: getCustomerFeedbacks
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/feedbacks/{id}:
    get:
      tags:
        - feedback
      summary: get Feedback By Id
      operationId: getFeedbackById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
    put:
      tags:
        - feedback
      summary: update Feedback Status
      operationId: updateFeedbackStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - open
                    - in_progress
                    - resolved
                    - closed
                assigned_to_staff_id:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
    delete:
      tags:
        - feedback
      summary: delete Feedback
      operationId: deleteFeedback
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/feedbacks/stats/summary:
    get:
      tags:
        - feedback
      summary: get Feedback Stats
      operationId: getFeedbackStats
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
tags: []
