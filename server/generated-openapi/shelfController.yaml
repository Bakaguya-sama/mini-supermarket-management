openapi: 3.0.0
info:
  title: Mini Supermarket API
  version: 1.0.0
  description: API cho hệ thống quản lý siêu thị mini
servers:
  - url: 'http://localhost:5000'
components:
  schemas:
    IdParam:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
paths:
  /api/shelves/stats:
    get:
      tags:
        - shelf
      summary: get Shelf Stats
      operationId: getShelfStats
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/shelves/category/{category}':
    get:
      tags:
        - shelf
      summary: get Shelves By Category
      operationId: getShelvesByCategory
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/shelves/available:
    get:
      tags:
        - shelf
      summary: get Available Shelves
      operationId: getAvailableShelves
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/shelves/{id}/toggle-full':
    put:
      tags:
        - shelf
      summary: toggle Shelf Full
      operationId: toggleShelfFull
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/shelves/{id}/capacity':
    get:
      tags:
        - shelf
      summary: get Shelf Capacity
      operationId: getShelfCapacity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
tags: []
