openapi: 3.0.0
info:
  title: Mini Supermarket API
  version: 1.0.0
  description: API cho hệ thống quản lý siêu thị mini
servers:
  - url: 'http://localhost:5000'
components:
  schemas:
    IdParam:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
paths:
  /api/customers:
    get:
      tags:
        - customer
      summary: Get all customers with pagination and filtering
      operationId: getAllCustomers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Records per page
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
              - pending
          description: Customer status filter
      responses:
        '200':
          description: Successfully retrieved customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
                  data:
                    type: array
        '400':
          description: Invalid query parameters
    post:
      tags:
        - customer
      summary: Create a new customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Nguyen Van A
                email:
                  type: string
                  format: email
                  example: customer@example.com
                phone:
                  type: string
                  pattern: '^[0-9]{10}$'
                  example: 0912345678
                address:
                  type: string
                  minLength: 5
                  maxLength: 500
                  example: 123 Main St
                membershipType:
                  type: string
                  enum:
                    - Standard
                    - Gold
                    - Silver
                  example: Standard
                age:
                  type: integer
                  minimum: 18
                  maximum: 120
                  example: 30
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - pending
                  default: active
              required:
                - name
                - email
                - phone
      responses:
        '201':
          description: Customer created successfully
        '400':
          description: Invalid customer data
        '422':
          description: Validation error
  '/api/customers/{id}':
    get:
      tags:
        - customer
      summary: Get customer by ID
      operationId: getCustomerById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
          description: MongoDB customer ID
      responses:
        '200':
          description: Customer found
        '400':
          description: Invalid customer ID format
        '404':
          description: Customer not found
    put:
      tags:
        - customer
      summary: Update customer details
      operationId: updateCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^[0-9]{10}$'
                address:
                  type: string
                  minLength: 5
                  maxLength: 500
                membershipType:
                  type: string
                  enum:
                    - Standard
                    - Gold
                    - Silver
                age:
                  type: integer
                  minimum: 18
                  maximum: 120
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - pending
      responses:
        '200':
          description: Customer updated successfully
        '400':
          description: Invalid customer data
        '404':
          description: Customer not found
        '422':
          description: Validation error
    delete:
      tags:
        - customer
      summary: Delete customer
      operationId: deleteCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
                  example: Customer requested deletion
      responses:
        '200':
          description: Customer deleted successfully
        '400':
          description: Invalid customer ID
        '404':
          description: Customer not found
  '/api/customers/account/{accountId}':
    get:
      tags:
        - customer
      summary: Get customer by account ID
      operationId: getCustomerByAccount
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
          description: MongoDB account ID
      responses:
        '200':
          description: Customer found by account
        '400':
          description: Invalid account ID format
        '404':
          description: Customer not found
  /api/customers/stats:
    get:
      tags:
        - customer
      summary: Get customer statistics
      operationId: getCustomerStats
      responses:
        '200':
          description: Customer statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalCustomers:
                        type: integer
                        minimum: 0
                      activeCustomers:
                        type: integer
                        minimum: 0
                      totalSpent:
                        type: number
                        minimum: 0
        '400':
          description: Error retrieving statistics
  '/api/customers/{id}/points':
    patch:
      tags:
        - customer
      summary: Update customer points
      operationId: updatePoints
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pointsToAdd:
                  type: integer
                  minimum: -10000
                  maximum: 10000
                  example: 100
              required:
                - pointsToAdd
      responses:
        '200':
          description: Points updated successfully
        '400':
          description: Invalid points value
        '404':
          description: Customer not found
        '422':
          description: Validation error
  '/api/customers/{id}/spent':
    patch:
      tags:
        - customer
      summary: Update total spent amount
      operationId: updateTotalSpent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0
                  maximum: 999999999
                  example: 150.5
              required:
                - amount
      responses:
        '200':
          description: Total spent updated successfully
        '400':
          description: Invalid amount
        '404':
          description: Customer not found
        '422':
          description: Validation error
  '/api/customers/{id}/orders':
    get:
      tags:
        - customer
      summary: Get customer orders
      operationId: getCustomerOrders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum:
              - pending
              - completed
              - cancelled
      responses:
        '200':
          description: Customer orders retrieved
        '400':
          description: Invalid query parameters
        '404':
          description: Customer not found
tags: []
