openapi: 3.0.0
info:
  title: Mini Supermarket API
  version: 1.0.0
  description: API cho hệ thống quản lý siêu thị mini
servers:
  - url: 'http://localhost:5000'
components:
  schemas:
    IdParam:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
paths:
  /api/product-stocks/stats:
    get:
      tags:
        - productStock
      summary: get Product Stock Stats
      operationId: getProductStockStats
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/product-stocks/product/{productId}':
    get:
      tags:
        - productStock
      summary: get Stock By Product
      operationId: getStockByProduct
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/product-stocks/shelf/{shelfId}':
    get:
      tags:
        - productStock
      summary: get Stock By Shelf
      operationId: getStockByShelf
      parameters:
        - in: path
          name: shelfId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/product-stocks/low-stock:
    get:
      tags:
        - productStock
      summary: get Low Stock Products
      operationId: getLowStockProducts
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  '/api/product-stocks/{id}/adjust':
    put:
      tags:
        - productStock
      summary: adjust Stock Quantity
      operationId: adjustStockQuantity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
  /api/product-stocks/bulk/update-status:
    put:
      tags:
        - productStock
      summary: bulk Update Status
      operationId: bulkUpdateStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
tags: []
